openapi: 3.1.0
info:
  title: Shipping API
  version: 1.5.0
paths:
  /v1/shipping-quote:
    get:
      operationId: shippingQuote
      responses:
        '200':
          description: Quote in cents. Clients must ignore unknown response fields.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [shippingFee]
                properties:
                  shippingFee:
                    type: integer
                    description: Shipping charge in USD cents.
                  carrierHint:
                    type: string
                    description: Optional display hint for the carrier.
